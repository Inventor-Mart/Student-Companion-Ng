name: Deploy Frontend to Netlify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'netlify.toml'
      - '.github/workflows/deploy-netlify.yml'

jobs:
  deploy-netlify:
    name: Build & Deploy PWA Frontend to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Check Netlify Secrets Configuration
        id: cfg
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub Repository Secrets first."
              exit 1
            else
              echo "::notice::Skipping automatic Netlify deploy until NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are added to GitHub Repository Secrets."
            fi
          fi

      - name: Checkout repository
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies & build Vite PWA
        if: steps.cfg.outputs.enabled == 'true'
        env:
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
        run: |
          export VITE_API_ORIGIN="${VITE_API_ORIGIN:-https://student-companion-api-b373.onrender.com}"
          echo "Netlify Build Config -> VITE_API_ORIGIN=${VITE_API_ORIGIN}, VITE_GOOGLE_MAPS_API_KEY=$([ -n \"$VITE_GOOGLE_MAPS_API_KEY\" ] && echo set || echo unset), VITE_PAYSTACK_PUBLIC_KEY=$([ -n \"$VITE_PAYSTACK_PUBLIC_KEY\" ] && echo set || echo unset)"
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy dist/ to Netlify Production
        if: steps.cfg.outputs.enabled == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Deploy Student Companion PWA (${GITHUB_SHA::7})"
