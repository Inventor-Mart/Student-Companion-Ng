name: Build Android 6+ Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'android-project/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Offline Android 6.0+ APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies & build offline web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          rm -rf android-project/app/src/main/assets/www
          mkdir -p android-project/app/src/main/assets/www
          cp -R dist/. android-project/app/src/main/assets/www/
          rm -rf android-project/app/src/main/assets/www/assets/aistudio
          ls -lh android-project/app/src/main/assets/www

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Offline Release APK (minSdk 23 / Android 6.0+)
        working-directory: android-project
        run: gradle assembleRelease --no-daemon

      - name: Prepare Signing Keystore & Sign Offline APK
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK="android-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find android-project/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release.keystore
            PASS="${KEYSTORE_PASS:-studentcompanion}"
            ALIAS="${KEY_ALIAS:-studentcompanion}"
            KPASS="${KEY_PASS:-$PASS}"
          else
            PASS="studentcompanion123"
            ALIAS="studentcompanion"
            KPASS="studentcompanion123"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KPASS" \
              -dname "CN=Student Companion, OU=Mobile, O=Inventor-Mart, L=Lagos, C=NG"
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            yes | sdkmanager "build-tools;34.0.0" >/dev/null 2>&1 || true
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
            ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)
          fi

          $ZIPALIGN -f -p 4 "$UNSIGNED_APK" aligned.apk
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" \
            --key-pass "pass:$KPASS" \
            --out StudentCompanion-v2.0.0-offline-android6plus.apk \
            aligned.apk

          $APKSIGNER verify StudentCompanion-v2.0.0-offline-android6plus.apk
          ls -lh StudentCompanion-v2.0.0-offline-android6plus.apk

      - name: Upload Offline APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentCompanion-v2.0.0-offline-android6plus
          path: StudentCompanion-v2.0.0-offline-android6plus.apk

      - name: Clean previous APK asset on android-latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset android-latest StudentCompanion-v1.0.0-android6plus.apk --yes || true

      - name: Publish Signed Offline Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Student Companion Offline Android 6.0+ (v2.0.0)
          make_latest: true
          body: |
            Complete offline standalone Android APK compatible with Android 6.0 Marshmallow (`minSdk 23`) and upwards (`targetSdk 34`).
            - Bundles full study notes, scheme of work, CBT exams, and offline queue directly inside APK assets
            - Package ID: `com.studentcompanion.app`
            - Version: `2.0.0`
          files: StudentCompanion-v2.0.0-offline-android6plus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
