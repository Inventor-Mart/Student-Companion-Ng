plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studentcompanion.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.studentcompanion.app"
        minSdk 23
        targetSdk 34
        versionCode(project.hasProperty('appVersionCode') ? project.property('appVersionCode').toInteger() : 20400000)
        versionName(project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : "2.4.0")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
